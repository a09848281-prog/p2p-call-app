name: Prototype checks
on:
  push:
    branches: [web-prototype-v0.1]
  pull_request:
    branches: [web-prototype-v0.1]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check web/app.js
          node --check web/sw.js
          node --check < gas/Code.gs
      - name: Check required files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f gas/Code.gs
      - name: Validate PWA manifest
        run: python -m json.tool web/manifest.webmanifest > /dev/null
