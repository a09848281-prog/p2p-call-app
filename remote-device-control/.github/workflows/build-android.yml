name: Build Remote Device Control APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'remote-device-control/android/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-device-control/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: remote-device-control-debug-apk
          path: remote-device-control/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error